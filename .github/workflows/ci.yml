name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · lint, types, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn build:pages
      - run: yarn build:server

  e2e:
    name: Web · browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  python:
    name: Python backend · lint, types, tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flamer
          POSTGRES_PASSWORD: flamer
          POSTGRES_DB: flamer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flamer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-python
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://flamer:flamer@localhost:5432/flamer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  docker:
    name: Docker · build both images and smoke-test the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile python build
      - run: docker compose --profile python up -d --wait
      - name: Smoke test Node and Python APIs
        run: |
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -q '"store":"upstash"'
          curl -fsS http://localhost:3001/api/health | tee /dev/stderr | grep -q '"runtime":"python"'
          curl -fsS http://localhost:3000/runs/run_igo_weekly | grep -q '<div id="root">'
          curl -fsS http://localhost:3001/runs/run_igo_weekly | grep -q '<div id="root">'
      - if: always()
        run: docker compose --profile python logs --no-color | tail -200
      - if: always()
        run: docker compose --profile python down -v
