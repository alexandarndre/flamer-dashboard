name: Smoke-test Vercel deployment

on: status

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, github.event.repository.default_branch) &&
      github.event.repository.homepage != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn e2e:smoke
        env:
          E2E_BASE_URL: ${{ github.event.repository.homepage }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-smoke-report
          path: playwright-report
          retention-days: 7
