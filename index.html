<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Content-ops dashboard for monitoring and unblocking domain crawls." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Flamer · Crawl operations</title>
    <script>
      try {
        const t = localStorage.getItem('flamer-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
